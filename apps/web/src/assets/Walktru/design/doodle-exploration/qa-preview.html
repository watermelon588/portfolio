#walkthru-worlds{--wt-ink:#20211f;--wt-paper:#faf8ef;--wt-white:#fff;--wt-muted:#66665e;--wt-line:#deded4;--wt-blue:#244bdc;--wt-coral:#f08264;--wt-yellow:#f7e95d;--wt-lime:#d7f36a;--wt-font-sans:&#x27;Geist Variable&#x27;,ui-sans-serif,system-ui,sans-serif;--wt-font-mono:&#x27;Geist Mono Variable&#x27;,ui-monospace,monospace;color-scheme:light;font-family:var(--wt-font-sans);font-weight:400;-webkit-font-smoothing:antialiased;color:var(--wt-ink);width:100%}
#walkthru-worlds *{box-sizing:border-box}
#walkthru-worlds [hidden]{display:none!important}
#walkthru-worlds .wt-page{min-height:940px;background:var(--wt-paper);position:relative;isolation:isolate;overflow-wrap:anywhere;display:flex;flex-direction:column}
#walkthru-worlds h1,#walkthru-worlds h2,#walkthru-worlds h3,#walkthru-worlds p{margin:0;color:inherit}
#walkthru-worlds h1{font-size:clamp(38px,6.6vw,72px);font-weight:200;line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
#walkthru-worlds h2{font-size:clamp(27px,3.8vw,43px);font-weight:300;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}
#walkthru-worlds h3{font-size:19px;line-height:1.25;letter-spacing:-.025em;font-weight:300;text-wrap:balance}
#walkthru-worlds p{font-size:15px;line-height:1.65}
#walkthru-worlds button,#walkthru-worlds input,#walkthru-worlds textarea{font:inherit}
#walkthru-worlds button{cursor:inherit}
#walkthru-worlds .wt-nav{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 38px;border-bottom:1px solid var(--wt-line)}
#walkthru-worlds .wt-brand{display:flex;gap:9px;align-items:center;font-size:24px;font-weight:400;letter-spacing:-.025em;white-space:nowrap}
#walkthru-worlds .wt-brand img{width:30px;height:34px;object-fit:contain}
#walkthru-worlds .wt-navlinks{display:flex;gap:25px;align-items:center;font-size:13px}
#walkthru-worlds .wt-button{border:1px solid var(--wt-ink);background:var(--wt-ink);color:var(--wt-white);border-radius:8px;padding:13px 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:400;min-height:44px;text-decoration:none;white-space:normal}
#walkthru-worlds .wt-button:hover{box-shadow:3px 3px 0 var(--wt-coral);transform:translate(-1px,-1px)}
#walkthru-worlds .wt-button.light{background:var(--wt-white);color:var(--wt-ink)}
#walkthru-worlds .wt-button.outline{background:transparent;color:inherit;border-color:currentColor}
#walkthru-worlds .wt-button.small{font-size:12px;padding:9px 14px}
#walkthru-worlds .wt-link{padding:8px 0;border:0;background:transparent;color:inherit;font-size:13px;text-decoration:underline;text-underline-offset:4px}
#walkthru-worlds .wt-tag{display:inline-flex;gap:7px;align-items:center;font-family:var(--wt-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
#walkthru-worlds .wt-note{font-family:var(--wt-font-sans);font-size:26px;line-height:1.2;font-weight:300;letter-spacing:-.025em}
#walkthru-worlds .wt-serif{font-family:var(--wt-font-sans);font-weight:200;letter-spacing:-.035em}
#walkthru-worlds .wt-muted{color:var(--wt-muted)}
#walkthru-worlds .wt-mono{font-family:var(--wt-font-mono);font-size:12px;line-height:1.6}
#walkthru-worlds strong{font-weight:500}
#walkthru-worlds .wt-actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:24px}
#walkthru-worlds .wt-body{padding:38px}
#walkthru-worlds .wt-art{display:block;width:100%;height:100%;object-fit:contain}
#walkthru-worlds .wt-artboard{background:var(--wt-white);border:1px solid var(--wt-line);padding:14px;position:relative}
#walkthru-worlds .wt-foot{display:flex;gap:14px;align-items:center;justify-content:space-between;border-top:1px solid var(--wt-line);padding:18px 38px;font-size:11px;letter-spacing:.03em;flex-wrap:wrap;margin-top:auto}
#walkthru-worlds .wt-demo{font-size:11px;color:var(--wt-muted);letter-spacing:.04em}
#walkthru-worlds .wt-result{margin-top:14px;font-size:13px;line-height:1.5;min-height:20px}
#walkthru-worlds label{display:block;font-size:12px;font-weight:500;margin-bottom:7px}
#walkthru-worlds input,#walkthru-worlds textarea{width:100%;background:var(--wt-white);color:var(--wt-ink);border:1px solid var(--wt-line);padding:13px 14px;border-radius:6px;min-height:44px;font-size:15px}
#walkthru-worlds textarea{resize:vertical;min-height:100px;line-height:1.5}
#walkthru-worlds .wt-rule{height:1px;background:var(--wt-line);margin:25px 0}
#walkthru-worlds .wt-grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}
#walkthru-worlds .wt-pill{padding:6px 10px;border:1px solid var(--wt-line);border-radius:100px;font-size:11px;display:inline-block;background:var(--wt-white);color:var(--wt-ink)}
#walkthru-worlds .wt-paperclip{position:absolute;top:-9px;left:45%;width:64px;height:23px;background:var(--wt-yellow);opacity:.8;transform:rotate(-6deg)}
#walkthru-worlds .wt-hero-paper{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;padding:48px 38px 35px;align-items:center}
#walkthru-worlds .wt-hero-paper h1{margin:15px 0 22px}
#walkthru-worlds .wt-hero-paper p{max-width:35ch}
#walkthru-worlds .wt-collage{height:420px;position:relative}
#walkthru-worlds .wt-collage .crowd{position:absolute;width:71%;height:340px;right:14%;top:20px;transform:rotate(5deg);box-shadow:8px 8px 0 var(--wt-ink)}
#walkthru-worlds .wt-collage .rooster{position:absolute;width:29%;height:190px;right:0;bottom:0;transform:rotate(-7deg)}
#walkthru-worlds .wt-collage .quote{position:absolute;left:0;bottom:0;width:67%;background:var(--wt-yellow);padding:20px;transform:rotate(-3deg);border:1px solid var(--wt-ink)}
#walkthru-worlds .wt-path-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;padding:24px 38px 40px}
#walkthru-worlds .wt-path-strip&gt;div{border-top:2px solid var(--wt-ink);padding-top:16px}
#walkthru-worlds .wt-path-strip p{font-size:13px;margin-top:6px}
#walkthru-worlds .wt-blue-page{background:var(--wt-blue);color:var(--wt-white);--wt-line:rgba(255,255,255,.24);--wt-muted:#dedfff}
#walkthru-worlds .wt-blue-page .wt-brand img{background:var(--wt-white);border-radius:4px;padding:3px}
#walkthru-worlds .wt-crowd-hero{display:grid;grid-template-columns:1fr .85fr;gap:25px;padding:38px;align-items:center}
#walkthru-worlds .wt-crowd-hero h1{font-size:clamp(36px,6.5vw,70px)}
#walkthru-worlds .wt-crowd-hero p{max-width:34ch;margin-top:22px}
#walkthru-worlds .wt-faceposter{height:420px;background:var(--wt-white);padding:12px;transform:rotate(3deg);border-radius:3px}
#walkthru-worlds .wt-persona-line{margin:0 38px 30px;padding:23px 0;border-top:1px solid var(--wt-line);display:grid;grid-template-columns:.8fr 1.4fr;gap:30px}
#walkthru-worlds .wt-personas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#walkthru-worlds .wt-personas button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:100px;padding:8px 12px;font-size:12px;min-height:40px}
#walkthru-worlds .wt-personas button[aria-pressed=true]{background:var(--wt-yellow);color:var(--wt-ink);border-color:var(--wt-yellow)}
#walkthru-worlds .wt-coral-page{background:#f8e2da;--wt-line:#d9b8ab}
#walkthru-worlds .wt-editorial{display:grid;grid-template-columns:1.15fr .85fr;gap:35px;align-items:center;padding:40px 38px}
#walkthru-worlds .wt-editorial h1{font-size:clamp(44px,7.6vw,83px);line-height:.99;margin:12px 0 20px}
#walkthru-worlds .wt-eye{background:var(--wt-coral);height:310px;transform:rotate(-4deg);position:relative;box-shadow:10px 10px 0 var(--wt-ink)}
#walkthru-worlds .wt-eye img{object-fit:contain}
#walkthru-worlds .wt-editorial-bottom{display:grid;grid-template-columns:1fr 1.9fr;gap:32px;padding:0 38px 28px}
#walkthru-worlds .wt-editorial-bottom img{height:170px}
#walkthru-worlds .wt-promises{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:25px;border-top:1px solid var(--wt-ink)}
#walkthru-worlds .wt-promises p{font-size:12px;margin-top:8px}
#walkthru-worlds .wt-letter-page{background:#edf0dc;--wt-line:#cbd0b7}
#walkthru-worlds .wt-letter{display:grid;grid-template-columns:1fr .82fr;gap:40px;align-items:center;padding:46px 55px 35px}
#walkthru-worlds .wt-letter h1{font-size:clamp(42px,6.4vw,70px);line-height:1.05;margin:16px 0 20px}
#walkthru-worlds .wt-letter p{max-width:37ch}
#walkthru-worlds .wt-letter-art{height:370px;background:var(--wt-white);border-radius:50% 50% 4px 4px;padding:28px}
#walkthru-worlds .wt-letter-checks{padding:24px 55px 35px;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;border-top:1px solid var(--wt-line)}
#walkthru-worlds .wt-checklist{display:grid;gap:12px;font-size:13px}
#walkthru-worlds .wt-shell{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:940px}
#walkthru-worlds .wt-sidebar{border-right:1px solid var(--wt-line);padding:24px 17px;display:flex;flex-direction:column;gap:26px}
#walkthru-worlds .wt-sidebar .wt-brand{font-size:21px}
#walkthru-worlds .wt-sidebar .wt-brand img{width:25px}
#walkthru-worlds .wt-sidebar-menu{display:grid;gap:5px}
#walkthru-worlds .wt-sidebar-menu span{font-size:12px;padding:10px 11px}
#walkthru-worlds .wt-sidebar-menu .selected{background:var(--wt-yellow);font-weight:500;border-radius:5px}
#walkthru-worlds .wt-sidebar-end{margin-top:auto;font-size:11px;color:var(--wt-muted)}
#walkthru-worlds .wt-work{min-width:0;padding:27px 30px}
#walkthru-worlds .wt-workhead{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px;font-size:12px;flex-wrap:wrap}
#walkthru-worlds .wt-work h1{font-size:39px;line-height:1.1;margin:9px 0 15px}
#walkthru-worlds .wt-notebook{display:grid;grid-template-columns:1.05fr .85fr;gap:36px;padding:46px;align-items:center}
#walkthru-worlds .wt-notebook h1{font-size:54px;margin:12px 0 24px}
#walkthru-worlds .wt-form{margin-top:28px;display:grid;gap:18px}
#walkthru-worlds .wt-notebook-art{height:400px;transform:rotate(3deg);background:var(--wt-white);padding:22px;box-shadow:7px 7px 0 var(--wt-blue)}
#walkthru-worlds .wt-onboard-bottom{padding:10px 46px 32px;display:flex;gap:22px;align-items:center;font-size:12px}
#walkthru-worlds .wt-onboard-bottom img{height:80px;width:100px}
#walkthru-worlds .wt-mission{display:grid;grid-template-columns:1fr 140px;gap:18px;background:#e7edd7;border:1px solid #c7d1b3;padding:23px;margin-top:24px;align-items:center}
#walkthru-worlds .wt-mission img{height:175px}
#walkthru-worlds .wt-mission input{margin-top:12px}
#walkthru-worlds .wt-mission .wt-actions{margin-top:14px}
#walkthru-worlds .wt-history{margin-top:28px}
#walkthru-worlds .wt-history-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
#walkthru-worlds .wt-run-row{display:grid;grid-template-columns:1.1fr .8fr .45fr;gap:15px;align-items:center;border-top:1px solid var(--wt-line);padding:16px 0;font-size:12px}
#walkthru-worlds .wt-run-row strong{display:block;font-size:13px;margin-bottom:3px}
#walkthru-worlds .wt-mini-scout{display:flex;gap:12px;align-items:center;margin-top:22px;font-size:12px}
#walkthru-worlds .wt-mini-scout img{width:31px;height:40px}
#walkthru-worlds .wt-report-page{background:#fbfaf6;--wt-line:#dbd9ce}
#walkthru-worlds .wt-report-header{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;padding:28px 34px 20px;align-items:center}
#walkthru-worlds .wt-report-header h1{font-size:40px;margin:10px 0 12px}
#walkthru-worlds .wt-report-header img{height:145px;width:100%}
#walkthru-worlds .wt-evidence{display:grid;grid-template-columns:175px minmax(0,1fr) 200px;margin:0 34px 25px;border:1px solid var(--wt-line);background:var(--wt-white)}
#walkthru-worlds .wt-steps{padding:17px 12px;border-right:1px solid var(--wt-line)}
#walkthru-worlds .wt-steps button{display:block;text-align:left;width:100%;background:transparent;border:0;border-radius:4px;padding:12px 10px;font-size:12px;line-height:1.4;color:var(--wt-ink)}
#walkthru-worlds .wt-steps button[aria-pressed=true]{background:var(--wt-yellow)}
#walkthru-worlds .wt-frame{padding:17px;min-width:0}
#walkthru-worlds .wt-frame .wt-tag{font-size:11px}
#walkthru-worlds .wt-evidence-model{padding:30px 15px;background:#f4f5ef;margin-top:18px;border:1px solid var(--wt-line);min-height:245px}
#walkthru-worlds .wt-evidence-model h3{margin-bottom:16px;font-size:20px}
#walkthru-worlds .wt-evidence-model input{margin:8px 0}
#walkthru-worlds .wt-evidence-model .wt-failed{font-size:11px;background:#f9e4dc;padding:10px;color:#843c29;margin-top:8px}
#walkthru-worlds .wt-inspector{padding:20px 15px;border-left:1px solid var(--wt-line);font-size:12px}
#walkthru-worlds .wt-inspector p{font-size:12px;margin:14px 0}
#walkthru-worlds .wt-inspector .wt-note{font-size:25px;margin-top:18px}
#walkthru-worlds .wt-report-bottom{display:flex;gap:25px;align-items:center;justify-content:space-between;padding:0 34px 24px;flex-wrap:wrap}
#walkthru-worlds .wt-atlas-header{display:grid;grid-template-columns:1.2fr .6fr;gap:20px;align-items:center}
#walkthru-worlds .wt-atlas-header img{height:185px}
#walkthru-worlds .wt-readiness{display:grid;grid-template-columns:.55fr 1.45fr;gap:26px;padding:25px 0;border-top:1px solid var(--wt-line);border-bottom:1px solid var(--wt-line);margin:22px 0}
#walkthru-worlds .wt-score{font-size:78px;line-height:1;letter-spacing:-.035em;font-weight:200}
#walkthru-worlds .wt-readiness .wt-score span{font-size:23px;letter-spacing:0}
#walkthru-worlds .wt-readiness p{font-size:12px;margin-top:10px}
#walkthru-worlds .wt-readiness ul{margin:0;padding:0;list-style:none;font-size:13px}
#walkthru-worlds .wt-readiness li{display:flex;justify-content:space-between;gap:15px;padding:9px 0}
#walkthru-worlds .wt-read-view{background:var(--wt-white);border:1px solid var(--wt-line);padding:23px;position:relative}
#walkthru-worlds .wt-read-view h3{margin:14px 0 10px}
#walkthru-worlds .wt-read-view p{font-size:13px;max-width:48ch}
#walkthru-worlds .wt-fix-layout{display:grid;grid-template-columns:1fr .7fr;gap:25px;margin-top:26px;align-items:start}
#walkthru-worlds .wt-fix-list{display:grid;gap:16px}

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
