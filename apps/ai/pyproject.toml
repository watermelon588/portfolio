[project]
name = "portfolio-ai"
version = "0.1.0"
description = "FastAPI AI sidecar — voice assistant + project RAG. See docs/AI_PIPELINE.md."
requires-python = ">=3.12"
readme = "README.md"

# Runtime deps are pinned in requirements.txt (works with plain pip/venv; no uv
# required). This file exists for tooling config (ruff/pytest) + metadata.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
